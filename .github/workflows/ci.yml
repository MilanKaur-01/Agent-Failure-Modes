name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Agent-Failure-Modes.sln
      - name: Build solution
        run: dotnet build Agent-Failure-Modes.sln --configuration Release --no-restore
      - name: Run Loop Failure demo
        run: dotnet run --configuration Release --no-build --project samples/LoopFailureDemo
      - name: Run Context Drop demo
        run: dotnet run --configuration Release --no-build --project samples/ContextDropDemo
      - name: Run Permission Escalation demo
        run: dotnet run --configuration Release --no-build --project samples/PermissionEscalationDemo
